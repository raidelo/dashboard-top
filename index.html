<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title></title>
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="sidebar">
      <ul>
        <li>
          <img id="logo-img" src="./static/dashboard.svg" alt="Dashboard" />
          <span>Dashboard</span>
        </li>
        <li>
          <img src="./static/home.svg" alt="Home" />
          <span>Home</span>
        </li>
        <li>
          <img src="./static/profile.svg" alt="Profile" />
          <span>Profile</span>
        </li>
        <li>
          <img src="./static/messages.svg" alt="Messages" />
          <span>Messages</span>
        </li>
        <li>
          <img src="./static/history.svg" alt="History" />
          <span>History</span>
        </li>
        <li>
          <img src="./static/tasks.svg" alt="Tasks" />
          <span>Tasks</span>
        </li>
        <li>
          <img src="./static/communities.svg" alt="Communities" />
          <span>Communities</span>
        </li>
        <li>
          <img src="./static/settings.svg" alt="Settings" />
          <span>Settings</span>
        </li>
        <li>
          <img src="./static/support.svg" alt="Support" />

        <li>
          <img src="./static/privacy.svg" alt="Privacy" />
          <span>Privacy</span>
        </li>
      </ul>
    </div>

    <header>
      <div id="search-sect">
        <img src="./static/search.svg" alt="Search" class="icon" />
        <input type="input" name="search" value="" />
        <img src="./static/bell.svg" alt="Notifications" class="icon" />

        <img src="./static/totoro.jpg" alt="" class="user-logo small" />
        <span>Test Name</span>
      </div>
      <div id="info-sect">
        <div id="user-info">
          <img src="./static/totoro.jpg" alt="" class="user-logo big" />
          <div>
            <p>Hi there,</p>
            <p>Test Name (@testnick)</p>
          </div>
        </div>
        <div>
          <button class="header-button" type="button">New</button>
          <button class="header-button" type="button">Upload</button>
          <button class="header-button" type="button">Share</button>
        </div>
      </div>
    </header>

    <main></main>
